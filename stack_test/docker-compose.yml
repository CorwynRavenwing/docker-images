# stack_test/docker-compose.yml

services:
  # --- 1. Nginx + PHP-FPM Stack ---
  php-fpm:
    image: php-fpm:${PHP_VERSION:-8.1}
    container_name: test-php-fpm
    volumes:
      - ./html:/var/www/html:ro

  web-nginx:
    image: nginx:alpine
    container_name: test-web-nginx
    ports:
      - "8080:80"
    volumes:
      - ./html:/var/www/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - php-fpm

  # --- 2. Apache + PHP Stack ---
  web-apache:
    image: php-apache:${PHP_VERSION:-8.1}
    container_name: test-web-apache
    ports:
      - "8081:80"
    volumes:
      - ./html:/var/www/html:ro
