# default.conf for PHP-FPM container

server {
    listen 80;
    server_name localhost;

    # The root folder inside the container where your site files live
    root /var/www/html;
    index index.php index.html;

    # 1. Handle regular static files or route unknown URLs to index.php
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # 2. Catch all requests ending in .php and pass them to PHP-FPM
    location ~ \.php$ {
        # Check that the PHP file actually exists on disk before passing it
        try_files $uri =404;

        # 'php-app' is the hostname of your PHP container in docker-compose
        fastcgi_pass php-app:9000;
        fastcgi_index index.php;

        # Standard FastCGI parameters telling PHP where to find the script
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
    }

    # 3. Deny access to hidden files (like .htaccess or .env)
    location ~ /\.ht {
        deny all;
    }
}

